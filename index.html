        // LEVEL EVALUATION SCENE (Kuis Akhir Level)
        // ==========================================
        class LevelEvaluationScene extends Phaser.Scene {
            constructor() { super({ key: 'LevelEvaluationScene' }); }
            init(data) { this.level = Phaser.Math.Clamp(Number.parseInt(data.level, 10) || 1, 1, 8); }
            
            create() {
                this.add.rectangle(0, 0, 1280, 720, 0x1a1a2e).setOrigin(0,0);
                this.questions = evaluationData[this.level - 1] || evaluationData[0];
                this.currentQIndex = 0; this.correctCount = 0; this.showQuestion();
            }

            showQuestion() {
                destroyAllSceneChildren(this); this.add.rectangle(0, 0, 1280, 720, 0x1a1a2e).setOrigin(0,0);
                this.answerLocked = false;
                let q = this.questions[this.currentQIndex];

                this.add.text(640, 100, `EVALUASI LEVEL ${this.level}`, { fontSize: '40px', fontStyle: 'bold', color: '#FFEB3B' }).setOrigin(0.5);
                this.add.text(640, 160, `Pertanyaan ${this.currentQIndex + 1} / ${this.questions.length} - ${q.difficulty}`, { fontSize: '24px', color: '#FFF' }).setOrigin(0.5);
                const questionText = this.add.text(640, 245, q.question, {
                    fontFamily: BODY_FONT, fontSize: '25px', color: '#FFF',
                    wordWrap: { width: 960 }, lineSpacing: 5, align: 'center'
                }).setOrigin(0.5);
                fitText(questionText, 960, 145, 18);

                this.optionBtns = []; let startY = 355;
                q.options.forEach((opt, index) => {
                    let btnBg = this.add.rectangle(640, startY + (index * 76), 860, 64, 0x4CAF50).setInteractive({ useHandCursor: true });
                    let btnText = this.add.text(640, startY + (index * 76), opt, {
                        fontFamily: BODY_FONT, fontSize: '20px', fontStyle: 'bold', color: '#FFF',
                        align: 'center', wordWrap: { width: 800 }, lineSpacing: 2
                    }).setOrigin(0.5);
                    fitText(btnText, 800, 52, 15);
                    this.optionBtns.push({ bg: btnBg, text: btnText, index: index });
                    btnBg.on('pointerdown', () => this.handleAnswer(index, q));
                });
            }

            handleAnswer(selectedIndex, q) {
                if (this.answerLocked) return;
                this.answerLocked = true;
                this.optionBtns.forEach(btn => btn.bg.disableInteractive());
                let isCorrect = (selectedIndex === q.correctAnswer);
                if (isCorrect) this.correctCount++;
                try { if (saveData && saveData.soundOn) this.sound.play(isCorrect ? 'sfx_correct' : 'sfx_wrong'); } catch(e){}

                this.optionBtns.forEach(btn => {
                    if (btn.index === q.correctAnswer) btn.bg.setFillStyle(0x2196F3);
                    else if (btn.index === selectedIndex && !isCorrect) btn.bg.setFillStyle(0xF44336);
                    else btn.bg.setFillStyle(0x555555);
                });

                this.add.text(640, 556, isCorrect ? 'BENAR!' : 'SALAH!', { fontSize: '28px', fontStyle: 'bold', color: isCorrect ? '#2196F3' : '#F44336' }).setOrigin(0.5);
                const explanationText = this.add.text(640, 620, q.explanation, {
                    fontFamily: BODY_FONT, fontSize: '18px', color: '#FFF',
                    wordWrap: { width: 980 }, lineSpacing: 3, align: 'center'
                }).setOrigin(0.5);
                fitText(explanationText, 980, 72, 14);

                let lanjutBtn = this.add.rectangle(640, 685, 200, 44, 0xFF9800).setInteractive({ useHandCursor: true });
                let lanjutTxt = this.add.text(640, 685, 'LANJUT', { fontSize: '20px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5);
                lanjutBtn.on('pointerdown', () => {
                    this.currentQIndex++;
                    if (this.currentQIndex < this.questions.length) { this.showQuestion(); } else { this.showResult(); }
                });
            }

            showResult() {
                destroyAllSceneChildren(this); this.add.rectangle(0, 0, 1280, 720, 0x1a1a2e).setOrigin(0,0);
                let percentage = Math.round((this.correctCount / this.questions.length) * 100);

                this.add.text(640, 200, 'EVALUASI SELESAI', { fontSize: '48px', fontStyle: 'bold', color: '#FFEB3B' }).setOrigin(0.5);
                this.add.text(640, 300, `Skor Benar: ${percentage}%`, { fontSize: '40px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5);
                applyEvaluationBuff(this, percentage, this.level);

                let lanjutBtn = this.add.rectangle(640, 650, 300, 60, 0x2196F3).setInteractive({ useHandCursor: true });
                let lanjutTxt = this.add.text(640, 650, 'KE RESULT LEVEL', { fontSize: '26px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                const handleResult = () => transitionToLevelComplete(this);
                lanjutBtn.once('pointerdown', handleResult); lanjutTxt.once('pointerdown', handleResult);
            }
        }

        class SortNutrisiScene extends Phaser.Scene {

            init(data) { this.level = Phaser.Math.Clamp(Number.parseInt(data.level, 10) || 1, 1, 8); }
            
            create() {
                this.add.rectangle(0, 0, 1280, 720, 0x1a1a2e).setOrigin(0,0);
                this.add.text(640, 80, `MINI GAME: SORTIR NUTRISI (LEVEL ${this.level})`, { fontSize: '36px', fontStyle: 'bold', color: '#FFEB3B' }).setOrigin(0.5);

                this.levelData = sortNutrisiData['level' + this.level] || sortNutrisiData.level2;
                this.itemsToPlay = [...this.levelData];
                Phaser.Utils.Array.Shuffle(this.itemsToPlay); 

                this.currentIndex = 0; this.correctCount = 0;
                this.currentEmoji = null; this.itemCounterText = null;

                this.categories = Object.keys(sortBoxLabels).map((key, idx) => ({
                    id: key, label: sortBoxLabels[key].label, color: sortBoxLabels[key].color, x: 250 + (idx * 260)
                }));

                this.catButtons = [];
                this.categories.forEach(cat => {
                    let btn = this.add.rectangle(cat.x, 600, 240, 100, cat.color).setInteractive({ useHandCursor: true });
                    btn.setStrokeStyle(4, 0xFFFFFF); 
                    
                    // PERBAIKAN: Font size disesuaikan agar muat, wordWrap ditambahkan.
                    this.add.text(cat.x, 600, cat.label, { fontSize: '20px', fontStyle: 'bold', color: '#FFF', align: 'center', wordWrap: { width: 230 } }).setOrigin(0.5);
                    
                    btn.on('pointerdown', () => this.handleDrop(cat.id));
                    this.catButtons.push({ btn: btn, catId: cat.id });
                });

                this.showNextItem();
            }

            showNextItem() {
                if (this.currentEmoji) {
                    this.tweens.killTweensOf(this.currentEmoji);
                    this.currentEmoji.destroy();
                    this.currentEmoji = null;
                }
                if (this.currentIndex >= this.itemsToPlay.length) { this.showResult(); return; }

                const counterValue = `Item ${this.currentIndex + 1} / ${this.itemsToPlay.length}`;
                if (this.itemCounterText && this.itemCounterText.active) {
                    this.itemCounterText.setText(counterValue);
                } else {
                    this.itemCounterText = this.add.text(640, 140, counterValue, { fontSize: '24px', color: '#FFF' }).setOrigin(0.5);
                }
                let currentDef = this.itemsToPlay[this.currentIndex]; 
                let fd = foodData[currentDef.id]; 
                this.currentBoxTarget = currentDef.box;

                this.currentEmoji = this.add.text(640, 300, fd.emoji, { fontSize: '100px', padding: { left: 20, right: 20, top: 20, bottom: 20 } }).setOrigin(0.5);
                this.tweens.add({ targets: this.currentEmoji, scale: 1.1, yoyo: true, repeat: -1, duration: 800 });
            }

            handleDrop(catId) {
                this.catButtons.forEach(b => b.btn.disableInteractive());
                let isCorrect = (catId === this.currentBoxTarget);
                if (isCorrect) this.correctCount++;
                try { if (saveData && saveData.soundOn) this.sound.play(isCorrect ? 'sfx_correct' : 'sfx_wrong'); } catch(e){}

                let fbColor = isCorrect ? 0x4CAF50 : 0xF44336; this.currentEmoji.setTint(fbColor);
                this.cameras.main.flash(300, isCorrect ? 0 : 255, isCorrect ? 255 : 0, 0);

                this.time.delayedCall(800, () => {
                    this.currentIndex++; this.catButtons.forEach(b => b.btn.setInteractive({ useHandCursor: true })); this.showNextItem();
                });
            }

            showResult() {
                destroyAllSceneChildren(this); this.add.rectangle(0, 0, 1280, 720, 0x1a1a2e).setOrigin(0,0);
                let percentage = Math.round((this.correctCount / this.itemsToPlay.length) * 100);

                this.add.text(640, 200, 'SORTIR SELESAI', { fontSize: '48px', fontStyle: 'bold', color: '#FFEB3B' }).setOrigin(0.5);
                this.add.text(640, 300, `Akurasi: ${percentage}%`, { fontSize: '40px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5);
                applyEvaluationBuff(this, percentage, this.level);

                let lanjutBtn = this.add.rectangle(640, 650, 300, 60, 0x2196F3).setInteractive({ useHandCursor: true });
                let lanjutTxt = this.add.text(640, 650, 'KE RESULT LEVEL', { fontSize: '26px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                const handleResult = () => transitionToLevelComplete(this);
                lanjutBtn.once('pointerdown', handleResult); lanjutTxt.once('pointerdown', handleResult);
            }
        }

        class UrutkanPencernaanScene extends Phaser.Scene {
            constructor() { super({ key: 'UrutkanPencernaanScene' }); }
            init(data) { this.level = Phaser.Math.Clamp(Number.parseInt(data.level, 10) || 1, 1, 8); }
            
            create() {
                this.add.rectangle(0, 0, 1280, 720, 0x1a1a2e).setOrigin(0,0);
                this.add.text(640, 60, `MINI GAME: URUTAN PENCERNAAN (LEVEL ${this.level})`, { fontSize: '36px', fontStyle: 'bold', color: '#FFEB3B' }).setOrigin(0.5);
                
                let flavor = urutkanPencernaanData.flavorText['level' + this.level] || urutkanPencernaanData.flavorText.level7;
                this.add.text(640, 120, flavor, { fontSize: '20px', color: '#FFF', wordWrap: {width: 1000}, align: 'center', fontStyle: 'italic' }).setOrigin(0.5);

                this.correctOrder = urutkanPencernaanData.correctOrder;
                this.organs = urutkanPencernaanData.organs;
                this.shuffledCards = Phaser.Utils.Array.Shuffle([...this.organs]); 
                this.filledSlots = []; 
                
                this.renderSlots(); this.renderCards();
            }

            renderSlots() {
                if (this.slotGroup) this.slotGroup.destroy(true); this.slotGroup = this.add.group();
                let startX = 180;
                for (let i = 0; i < 6; i++) {
                    let x = startX + (i * 180); let y = 250;
                    let bg = this.add.rectangle(x, y, 160, 60, 0x333333).setStrokeStyle(2, 0xFFFFFF);
                    let slotLabel = this.add.text(x, y - 50, `Ke-${i+1}`, { fontSize: '20px', color: '#FFF' }).setOrigin(0.5);
                    this.slotGroup.add(bg); this.slotGroup.add(slotLabel);

                    if (this.filledSlots[i]) {
                        let organ = this.organs.find(o => o.id === this.filledSlots[i]);
                        let txt = this.add.text(x, y, organ.label, { fontSize: '18px', fontStyle: 'bold', color: '#FFEB3B', padding: { left: 10, right: 10, top: 5, bottom: 5 } }).setOrigin(0.5);
                        this.slotGroup.add(txt);
                    }
                }
            }

            renderCards() {
                if (this.cardGroup) this.cardGroup.destroy(true); this.cardGroup = this.add.group();
                let startX = 180;
                let displayIndex = 0;
                this.shuffledCards.forEach((organ) => {
                    if (this.filledSlots.includes(organ.id)) return; 
                    let x = startX + (displayIndex * 180); let y = 450;
                    let btn = this.add.rectangle(x, y, 160, 80, 0x2196F3).setInteractive({ useHandCursor: true });
                    let txt = this.add.text(x, y, organ.label, { fontSize: '18px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5);

                    btn.on('pointerdown', () => {
                        if (this.filledSlots.length < 6) {
                            try { if (saveData && saveData.soundOn) this.sound.play('sfx_click'); } catch(e){}
                            this.filledSlots.push(organ.id); this.renderSlots(); this.renderCards(); this.checkComplete();
                        }
                    });
                    this.cardGroup.add(btn); this.cardGroup.add(txt);
                    displayIndex++;
                });
            }

            checkComplete() {
                if (this.filledSlots.length === 6) {
                    if (this.submitBtn) return;
                    this.submitBtn = this.add.group();
                    let bg = this.add.rectangle(640, 580, 200, 60, 0x4CAF50).setInteractive({ useHandCursor: true });
                    let txt = this.add.text(640, 580, 'SELESAI', { fontSize: '26px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5);
                    bg.on('pointerdown', () => this.showResult());
                    this.submitBtn.add(bg); this.submitBtn.add(txt);
                }
            }

            showResult() {
                if (this.slotGroup) { this.slotGroup.destroy(true); this.slotGroup = null; }
                if (this.cardGroup) { this.cardGroup.destroy(true); this.cardGroup = null; }
                if (this.submitBtn) { this.submitBtn.destroy(true); this.submitBtn = null; }
                destroyAllSceneChildren(this); this.add.rectangle(0, 0, 1280, 720, 0x1a1a2e).setOrigin(0,0);
                this.add.text(640, 80, 'HASIL URUTAN PENCERNAAN', { fontSize: '40px', fontStyle: 'bold', color: '#FFEB3B' }).setOrigin(0.5);

                let correctCount = 0; let startY = 180;
                for (let i = 0; i < 6; i++) {
                    let isCorrect = (this.filledSlots[i] === this.correctOrder[i]);
                    if (isCorrect) correctCount++;
                    let color = isCorrect ? '#4CAF50' : '#F44336'; let icon = isCorrect ? '✔️' : '❌';
                    let organ = this.organs.find(o => o.id === this.filledSlots[i]);
                    this.add.text(640, startY + (i * 40), `${i+1}. ${organ ? organ.label : '-'} ${icon}`, { fontSize: '24px', color: color, fontStyle: 'bold', padding: { left: 10, right: 10, top: 10, bottom: 10 } }).setOrigin(0.5);
                }

                let percentage = Math.round((correctCount / 6) * 100);
                this.add.text(640, 450, `Akurasi: ${percentage}%`, { fontSize: '36px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5);
                applyEvaluationBuff(this, percentage, this.level);

                let lanjutBtn = this.add.rectangle(640, 650, 300, 60, 0x2196F3).setInteractive({ useHandCursor: true });
                let lanjutTxt = this.add.text(640, 650, 'KE RESULT LEVEL', { fontSize: '26px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                const handleResult = () => transitionToLevelComplete(this);
                lanjutBtn.once('pointerdown', handleResult); lanjutTxt.once('pointerdown', handleResult);
            }
        }

            create() {
                this.scene.bringToTop(); this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.85).setInteractive();
                this.answerLocked = false;
                if (!gameState.availableQuizzes || gameState.availableQuizzes.length === 0) {

                fitText(quizQuestion, 720, 90, 17);

                this.optionBtns = []; let startY = 320;
                this.quiz.options.forEach((opt, index) => {
                    let btnBg = this.add.rectangle(640, startY + (index * 70), 600, 56, 0x4CAF50).setInteractive({ useHandCursor: true });
                    let btnText = this.add.text(640, startY + (index * 70), opt, {
                        fontFamily: BODY_FONT, fontSize: '20px', fontStyle: 'bold', color: '#FFF',
                        align: 'center', wordWrap: { width: 550 }, lineSpacing: 2
                    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                    fitText(btnText, 550, 46, 15);
                    this.optionBtns.push({ bg: btnBg, text: btnText, index: index });
                    
                    const handleSelect = () => { try { if (saveData.soundOn) this.sound.play('sfx_click'); } catch(e){} this.handleAnswer(index); };
                    btnBg.on('pointerdown', handleSelect); btnText.on('pointerdown', handleSelect);
                });
            }

            handleAnswer(selectedIndex) {
                if (this.answerLocked) return;
                this.answerLocked = true;
                this.optionBtns.forEach(btn => {
                    btn.bg.disableInteractive();
                    btn.text.disableInteractive();
                });
                let isCorrect = (selectedIndex === this.quiz.correctAnswer);
                try { if (saveData.soundOn) this.sound.play(isCorrect ? 'sfx_correct' : 'sfx_wrong'); } catch(e){}

                this.optionBtns.forEach(btn => {
                    if (btn.index === this.quiz.correctAnswer) btn.bg.setFillStyle(0x2196F3); 
                    else if (btn.index === selectedIndex && !isCorrect) btn.bg.setFillStyle(0xF44336); 
                    else btn.bg.setFillStyle(0x555555); 
                });

                this.add.text(640, 505, isCorrect ? 'JAWABAN TEPAT!' : 'JAWABAN KURANG TEPAT!', { fontSize: '25px', fontStyle: 'bold', color: isCorrect ? '#2196F3' : '#F44336' }).setOrigin(0.5);
                const quizExplanation = this.add.text(640, 555, this.quiz.explanation, {
                    fontFamily: BODY_FONT, fontSize: '17px', color: '#FFF',
                    wordWrap: { width: 720 }, lineSpacing: 3, align: 'center'
                }).setOrigin(0.5);
                fitText(quizExplanation, 720, 72, 14);
                
                let lanjutBtn = this.add.rectangle(640, 620, 200, 50, 0xFF9800).setInteractive({ useHandCursor: true });
                let lanjutTxt = this.add.text(640, 620, 'LANJUT', { fontSize: '22px', fontStyle: 'bold', color: '#FFF' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                
                const handleLanjut = () => {
                    try { if (saveData.soundOn) this.sound.play('sfx_click'); } catch(e){}
                    if (isCorrect) { this.applyBuff(); saveData.stats.quizzesCorrect++; checkAndUnlockAchievements(this.scene.get('GameScene')); }
                    this.scene.resume('GameScene'); this.scene.resume('UIScene'); this.scene.stop();
                };
                lanjutBtn.on('pointerdown', handleLanjut); lanjutTxt.on('pointerdown', handleLanjut);
            }

            applyBuff() {
                try { if (saveData.soundOn) this.sound.play('sfx_buff'); } catch(e){}
                const gameScene = this.scene.get('GameScene'); const buffs = ['KEBAL', 'DOUBLE', 'LIFE'];
                const selectedBuff = buffs[Phaser.Math.Between(0, 2)];

                if (selectedBuff === 'KEBAL') {
                    gameState.invincibleTimer = 5; gameScene.showFloatingText(this.playerPos.playerX, this.playerPos.playerY - 120, '🛡️ KEBAL 5 DETIK!', '#FFEB3B');
                } else if (selectedBuff === 'DOUBLE') {
                    gameState.doublePointTimer = 8; gameScene.showFloatingText(this.playerPos.playerX, this.playerPos.playerY - 120, '⭐ DOUBLE POIN 8 DETIK!', '#4CAF50');
                } else if (selectedBuff === 'LIFE') {
                    gameState.health = Math.min(5, gameState.health + 1); gameState.extraLifeAuraTimer = 2; 
                    gameScene.showFloatingText(this.playerPos.playerX, this.playerPos.playerY - 120, '❤️ EKSTRA LIFE +1!', '#F44336');
                }
                gameScene.events.emit('updateUI');
            }
        }

                this.level = Number.isFinite(completedLevel)
                    ? Phaser.Math.Clamp(completedLevel, 1, 8)
                    : clampCurrentLevel('LevelCompleteScene.init');
                currentLevel = this.level;
            }
            create() {
                try {
                const completedLevel = this.level || clampCurrentLevel('LevelCompleteScene.create');
                this.scene.get('AudioScene').stopMusic();
                try { if (saveData.soundOn) this.sound.play('sfx_win'); } catch(e){}
                this.scene.bringToTop();
                this.add.rectangle(0,0,1280,720,0x000000, 0.9).setOrigin(0,0).setInteractive();

                let timeTaken = (this.time.now - gameState.startTime) / 1000;
                let timeBonus = Math.max(0, 1500 - Math.floor(timeTaken) * 10); 
                let finalScore = gameState.score + timeBonus;

                let stars = 1; if (finalScore >= 2000) stars = 2;
                if (finalScore >= 3000 && gameState.balancedMealsCount >= 1 && gameState.health === gameState.maxHealth && !gameState.experiencedCrash) stars = 3;
                if (!gameState.experiencedCrash) saveData.stats.cleanRuns++;

                let startY = 170; let textStyle = { fontSize: '26px', color: '#FFF' }; let numStyle = { fontSize: '26px', fontStyle: 'bold', color: '#FFEB3B' };
                this.add.text(500, startY, 'Healthy Food:', textStyle).setOrigin(1, 0.5); this.add.text(520, startY, gameState.scoreBreakdown.food.toLocaleString(), numStyle).setOrigin(0, 0.5);
                this.add.text(500, startY + 40, 'Nutrition Combo:', textStyle).setOrigin(1, 0.5); this.add.text(520, startY + 40, gameState.scoreBreakdown.combo.toLocaleString(), numStyle).setOrigin(0, 0.5);
                this.add.text(500, startY + 80, 'Time Bonus:', textStyle).setOrigin(1, 0.5); this.add.text(520, startY + 80, timeBonus.toLocaleString(), numStyle).setOrigin(0, 0.5);

                let starString = ''; for (let i = 1; i <= 3; i++) { starString += (i <= stars) ? '⭐ ' : '☆ '; }
                this.add.text(640, startY + 210, starString.trim(), { fontSize: '48px', padding: { top: 10, bottom: 10 } }).setOrigin(0.5);

                let tipStr = levelTips[completedLevel - 1] || "Makan makanan bergizi seimbang setiap hari!";

                    align: 'center', wordWrap: { width: 900 }, lineSpacing: 5
                }).setOrigin(0.5);
                fitText(resultTip, 900, 92, 14);

                let currentLvlKey = 'level' + completedLevel;
                if (!saveData.levels[currentLvlKey]) saveData.levels[currentLvlKey] = { unlocked: true, stars: 0, bestScore: 0 };

                let isNewRecord = false;
                if (finalScore > saveData.highScore) { saveData.highScore = finalScore; isNewRecord = true; }
                if (finalScore > saveData.levels[currentLvlKey].bestScore) { saveData.levels[currentLvlKey].bestScore = finalScore; }
                saveData.levels[currentLvlKey].stars = Math.max(saveData.levels[currentLvlKey].stars, stars);
                
                if (stars >= 1 && completedLevel < 8) {
                    let nextLvlKey = 'level' + (completedLevel + 1);
                    if (!saveData.levels[nextLvlKey]) saveData.levels[nextLvlKey] = { unlocked: false, stars: 0, bestScore: 0 };
                    saveData.levels[nextLvlKey].unlocked = true;

                if (isNewRecord) this.add.text(640, startY + 360, 'NEW HIGH SCORE!', { fontSize: '24px', fontStyle: 'bold', color: '#FF5252', stroke: '#FFF', strokeThickness: 2 }).setOrigin(0.5);

                const handleNext = () => {
                    if (isTransitioning) return; try { if (saveData.soundOn) this.sound.play('sfx_click'); } catch(e){}
                    if (stars >= 1 && completedLevel < 8) {
                        isTransitioning = true;
                        this.input.enabled = false;
                        nextBtn.disableInteractive();

                        startLevelIntro(this, completedLevel + 1);

                    else if (completedLevel >= 8) { isTransitioning = true; this.scene.start('MainMenuScene'); } 
                    else { alert("Harus dapat minimal 1 bintang untuk ke level selanjutnya!"); }

                };
                menuBtn.on('pointerdown', handleMenu); menuTxt.on('pointerdown', handleMenu);
                } catch (error) {
                    showSceneLoadError(this, error);
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            backgroundColor: '#1a1a2e',
            loader: {
                timeout: 10000,
                maxRetries: 0,
                maxParallelDownloads: 32
            },
            render: {
                antialias: false,
                pixelArt: true
            },
            scale: {
                // FIT mempertahankan seluruh area game 16:9 agar judul, HUD, dan tombol
                // tidak terpotong pada HP landscape yang lebih lebar dari 16:9.
                mode: Phaser.Scale.FIT,
                // Posisi ditangani Flexbox agar tidak terjadi pemusatan ganda.
                autoCenter: Phaser.Scale.NO_CENTER,
                width: 1280,
                height: 720,
                parent: 'game-container',
                expandParent: true
            },
            input: {
                activePointers: 3
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: DEBUG_MODE
                }
            },
            scene: [
                BootScene, AudioScene, StartScene, DisplayModeScene, MainMenuScene, TujuanPembelajaranScene, MateriPembelajaranScene,
                IntroScene, GameScene, UIScene, PauseScene, SettingsScene, AchievementScene, FoodpediaScene,
                LevelSelectScene, HowToPlayScene, GameOverScene, LevelCompleteScene, QuizScene, TutorialPopupScene,
                SortNutrisiScene, UrutkanPencernaanScene, LevelEvaluationScene
            ]
        };

        window.addEventListener('resize', () => {
            if (window.game && window.game.scale) {
                window.game.scale.refresh();
            }
        });

        const game = new Phaser.Game(config);
        window.game = game;
    </script>
</body>
</html>
