<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>JAGOAN GIZI</title>
    
    <!-- Phaser 3 Library + CDN fallback -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
        if (!window.Phaser) {
            document.write('<script src="https://unpkg.com/phaser@3.60.0/dist/phaser.min.js"><\/script>');
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }
        body {
            background:
                radial-gradient(circle at 50% 45%, #243f58 0%, #15283b 48%, #09131f 100%);
            margin: 0;
            font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
        }
        #game-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
            /* Desktop tidak memerlukan safe-area; padding asimetris dapat
               membuat kanvas tampak bergeser dari pusat viewport. */
            padding: 0;
        }
        canvas {
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            display: block;
            max-width: 100%;
            max-height: 100%;
            border-radius: 4px;
            /* Flexbox menjadi satu-satunya pengatur posisi kanvas. */
            margin: 0 !important;
            position: static !important;
            inset: auto !important;
        }
        @media (hover: none) and (pointer: coarse) {
            #game-container {
                /* Safe-area hanya digunakan pada HP/tablet sentuh. */
                padding:
                    max(4px, env(safe-area-inset-top))
                    max(4px, env(safe-area-inset-right))
                    max(4px, env(safe-area-inset-bottom))
                    max(4px, env(safe-area-inset-left));
            }
        }
        @media (orientation: portrait) {
            #game-container::after {
                content: 'Putar HP ke mode LANDSCAPE untuk bermain';
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                background: #1a1a2e;
                color: white;
                font-size: clamp(18px, 4vw, 28px);
                font-weight: bold;
                text-align: center;
                padding: 30px;
                z-index: 20;
            }
        }
        #boot-status {
            position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
            padding: 24px; background: #1a1a2e; color: #fff; text-align: center;
            font: 700 20px/1.5 "Courier New", monospace;
        }
        #boot-status[hidden] { display: none; }
        #boot-status.error { color: #ffb4ab; }
    </style>
</head>
<body>

    <div id="boot-status" role="status" aria-live="polite">MENYIAPKAN JAGOAN GIZI...</div>
    <div id="game-container"></div>

    <script>
        window.addEventListener('error', e => {
            console.error('GAME ERROR:', e.message, e.filename, e.lineno);
        });
        window.addEventListener('unhandledrejection', e => {
            console.error('GAME PROMISE ERROR:', e.reason);
        });

        if (!window.Phaser) {
            const status = document.getElementById('boot-status');
            status.classList.add('error');
            status.innerHTML = 'GAME GAGAL DIMUAT.<br>Periksa koneksi internet, lalu muat ulang halaman.';
            throw new Error('Phaser gagal dimuat dari kedua CDN.');
        }

        const DEBUG_MODE = false;
        const PIXEL_FONT = '"Lucida Console", "Courier New", monospace';
        const BODY_FONT = '"Trebuchet MS", "Segoe UI", Arial, sans-serif';

        function installReadableTextDefaults() {
            const factory = Phaser.GameObjects.GameObjectFactory.prototype;
            if (factory.__jagoanGiziReadableText) return;
            const originalText = factory.text;

            factory.text = function(x, y, value, style = {}) {
                const source = Array.isArray(value) ? value.join('\n') : String(value ?? '');
                const isBodyText = !!style.wordWrap || style.fontStyle === 'italic' || source.includes('\n') || source.length > 48;
                const originalPadding = style.padding || {};
                const safePadding = {
                    left: originalPadding.left ?? 3,
                    right: originalPadding.right ?? 3,
                    top: originalPadding.top ?? 6,
                    bottom: originalPadding.bottom ?? 6
                };
                const mergedStyle = {
                    fontFamily: isBodyText ? BODY_FONT : PIXEL_FONT,
                    lineSpacing: isBodyText ? 6 : 2,
                    resolution: Math.max(2, window.devicePixelRatio || 1),
                    ...style,
                    padding: safePadding
                };
                return originalText.call(this, x, y, value, mergedStyle);
            };
            factory.__jagoanGiziReadableText = true;
        }

        function fitText(textObject, maxWidth, maxHeight, minFontSize = 14) {
            if (!textObject) return textObject;
            let fontSize = parseFloat(textObject.style.fontSize) || 16;
            const exceedsBounds = () => {
                const padding = textObject.padding || {};
                const contentWidth = textObject.width - (padding.left || 0) - (padding.right || 0);
                const contentHeight = textObject.height - (padding.top || 0) - (padding.bottom || 0);
                return contentWidth > maxWidth || contentHeight > maxHeight;
            };
            while (exceedsBounds() && fontSize > minFontSize) {
                fontSize -= 1;
                textObject.setFontSize(fontSize);
            }
            return textObject;
        }

        installReadableTextDefaults();

        function clampCurrentLevel(context = 'unknown') {
            const parsedLevel = Number.parseInt(currentLevel, 10);
            const safeLevel = Number.isFinite(parsedLevel) ? Phaser.Math.Clamp(parsedLevel, 1, 8) : 1;
            if (safeLevel !== currentLevel) {
                console.warn(`Level tidak valid pada ${context}:`, currentLevel, '->', safeLevel);
                currentLevel = safeLevel;
            }
            return safeLevel;
        }

        function destroyAllSceneChildren(scene) {
            const children = scene.children ? [...scene.children.getChildren()] : [];
            children.forEach(child => {
                if (!child) return;
                if (scene.tweens) scene.tweens.killTweensOf(child);
                if (child.destroy) child.destroy();
            });
        }

        function showSceneLoadError(scene, error) {
            console.error(`Gagal membuat ${scene.scene.key}:`, error);
            try { scene.scene.stop('UIScene'); } catch (e) {}
            try { scene.physics.pause(); } catch (e) {}
            try { destroyAllSceneChildren(scene); } catch (e) {}
            if (scene.input) scene.input.enabled = true;

            scene.add.rectangle(0, 0, 1280, 720, 0x1a1a2e).setOrigin(0, 0);
            const message = scene.add.text(640, 285, 'Terjadi kendala saat memuat level.\nSilakan kembali dan coba lagi.', {
                fontFamily: BODY_FONT, fontSize: '28px', fontStyle: 'bold', color: '#FFFFFF',
                align: 'center', wordWrap: { width: 900 }, lineSpacing: 8,
                stroke: '#000000', strokeThickness: 4
            }).setOrigin(0.5);
            fitText(message, 900, 150, 18);

            const backButton = scene.add.rectangle(640, 450, 360, 68, 0x2196F3)
                .setStrokeStyle(3, 0xFFFFFF).setInteractive({ useHandCursor: true });
            const backText = scene.add.text(640, 450, 'KEMBALI KE PILIH LEVEL', {
                fontSize: '22px', fontStyle: 'bold', color: '#FFFFFF',
                stroke: '#000000', strokeThickness: 3
            }).setOrigin(0.5).setInteractive({ useHandCursor: true });
            const goBack = () => scene.scene.start('LevelSelectScene');
            backButton.once('pointerdown', goBack);
            backText.once('pointerdown', goBack);
        }

        function cleanupEvaluationBuff(scene) {
            if (scene.evaluationBuffText && scene.tweens) {
                scene.tweens.killTweensOf(scene.evaluationBuffText);
            }
            if (scene.evaluationBuffText && scene.evaluationBuffText.active) {
                scene.evaluationBuffText.destroy();
            }
            scene.evaluationBuffText = null;
            scene.evaluationBuffTween = null;
        }

        function transitionToLevelComplete(scene) {
            if (scene.resultTransitionStarted) return;
            scene.resultTransitionStarted = true;
            if (scene.input) scene.input.enabled = false;

            try {
                cleanupEvaluationBuff(scene);
                // Bawa nomor level secara eksplisit. Mengandalkan currentLevel saja
                // membuat result dan loader level berikutnya rawan membaca state global
                // yang sudah berubah di tengah pergantian scene.
                const completedLevel = Phaser.Math.Clamp(
                    Number.parseInt(scene.level ?? currentLevel, 10) || 1,
                    1,
                    8
                );
                scene.scene.stop('UIScene');
                scene.scene.start('LevelCompleteScene', { level: completedLevel });
            } catch (error) {
                scene.resultTransitionStarted = false;
                showSceneLoadError(scene, error);
            }
        }

        const LEVEL_RUNTIME_SCENES = Object.freeze([
            'GameScene', 'UIScene', 'PauseScene', 'GameOverScene', 'QuizScene',
            'TutorialPopupScene', 'LevelEvaluationScene', 'SortNutrisiScene',
            'UrutkanPencernaanScene', 'LevelCompleteScene'
        ]);

        function stopLingeringLevelScenes(scene) {
            const callerKey = scene?.sys?.settings?.key;
            LEVEL_RUNTIME_SCENES.forEach(key => {
                if (key === callerKey) return;
                try {
                    if (scene.scene.isActive(key) || scene.scene.isPaused(key) || scene.scene.isSleeping(key)) {
                        scene.scene.stop(key);
                    }
                } catch (error) {
                    console.warn('Gagal membersihkan scene lama:', key, error);
                }
            });
        }

        function startLevelIntro(scene, requestedLevel) {
            const parsedLevel = Number.parseInt(requestedLevel, 10);
            const nextLevel = Number.isFinite(parsedLevel) ? Phaser.Math.Clamp(parsedLevel, 1, 8) : 1;

            try {
                currentLevel = nextLevel;
                gameState.savedCheckpoint = null;
                stopLingeringLevelScenes(scene);

                // Mulai scene berikutnya langsung dari event tombol. Sebelumnya transisi
                // ditaruh di delayedCall milik LevelCompleteScene setelah input dimatikan.
                // Pada sebagian browser/runtime, callback itu tidak sempat diproses dan
                // layar hasil terlihat membeku. IntroScene sudah memiliki inputReadyAt,
                // sehingga event klik NEXT LEVEL tidak akan dianggap sebagai tap mulai.
                scene.scene.start('IntroScene', { level: nextLevel });
                return true;
            } catch (error) {
                if (scene.input) scene.input.enabled = true;
                showSceneLoadError(scene, error);
                return false;
            }
        }

        const ASSET_URLS = Object.freeze({
            character: 'https://raw.githubusercontent.com/yudika-web/db_char_boy_asset_1/main/',
            background: 'https://raw.githubusercontent.com/yudika-web/db_background_game/main/',
            obstacle: 'https://raw.githubusercontent.com/yudika-web/db_obstacle_jagoan_gizi/main/',
            enemy: 'https://raw.githubusercontent.com/yudika-web/db_enemy_game_JG/main/',
            vfx: 'https://raw.githubusercontent.com/yudika-web/db_background_game/main/'
        });

        function setBootStatus(message, isError = false) {
            const status = document.getElementById('boot-status');
            if (!status) return;
            status.textContent = message;
            status.classList.toggle('error', isError);
        }

        const FALLBACK_TEXTURE_KEYS = new Set();

        function queueImage(scene, key, url) {
            if (FALLBACK_TEXTURE_KEYS.has(key)) {
                scene.textures.remove(key);
                FALLBACK_TEXTURE_KEYS.delete(key);
            }
            if (!scene.textures.exists(key)) scene.load.image(key, url);
        }

        function createFallbackTexture(scene, key, width, height, kind, color = '#4CAF50') {
            if (scene.textures.exists(key)) return;
            const texture = scene.textures.createCanvas(key, width, height);
            const ctx = texture.getContext();
            ctx.clearRect(0, 0, width, height);
            ctx.imageSmoothingEnabled = false;

            if (kind === 'background') {
                const gradient = ctx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, '#152238');
                gradient.addColorStop(0.62, '#24536b');
                gradient.addColorStop(1, '#3d7c47');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(255,255,255,.12)';
                for (let x = 30; x < width; x += 90) ctx.fillRect(x, 90 + (x % 180), 4, 4);
                ctx.fillStyle = 'rgba(0,0,0,.18)';
                for (let x = 0; x < width; x += 80) ctx.fillRect(x, height - 150 - (x % 3) * 24, 52, 150);
                if (key === 'bg_start') {
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#FFEB3B';
                    ctx.font = 'bold 88px sans-serif';
                    ctx.fillText('JAGOAN GIZI', width / 2, 250);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 30px sans-serif';
                    ctx.fillText('PETUALANGAN MAKANAN SEHAT', width / 2, 305);
                }
            } else if (kind === 'player') {
                ctx.fillStyle = '#263238'; ctx.fillRect(20, 8, 24, 24);
                ctx.fillStyle = '#ffcc80'; ctx.fillRect(22, 15, 20, 18);
                ctx.fillStyle = '#2196F3'; ctx.fillRect(15, 34, 34, 38);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(23, 20, 4, 4); ctx.fillRect(36, 20, 4, 4);
                ctx.fillStyle = '#1a237e'; ctx.fillRect(17, 72, 12, 22); ctx.fillRect(35, 72, 12, 22);
            } else if (kind === 'enemy') {
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(width / 2, height / 2, Math.min(width, height) * .38, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.fillRect(width * .25, height * .34, 9, 9); ctx.fillRect(width * .6, height * .34, 9, 9);
                ctx.fillStyle = '#111111'; ctx.fillRect(width * .29, height * .38, 4, 4); ctx.fillRect(width * .64, height * .38, 4, 4);
            } else if (kind === 'aura') {
                ctx.strokeStyle = color; ctx.lineWidth = 8; ctx.globalAlpha = .75;
                ctx.beginPath(); ctx.ellipse(width / 2, height / 2, width * .38, height * .43, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.globalAlpha = 1;
            } else if (kind === 'mystery') {
                ctx.fillStyle = '#FF9800'; ctx.fillRect(4, 4, width - 8, height - 8);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.strokeRect(5, 5, width - 10, height - 10);
                ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.font = `bold ${Math.floor(height * .65)}px sans-serif`; ctx.fillText('?', width / 2, height * .76);
            } else {
                ctx.fillStyle = color; ctx.fillRect(2, 2, width - 4, height - 4);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.strokeRect(4, 4, width - 8, height - 8);
                ctx.fillStyle = 'rgba(0,0,0,.2)';
                for (let y = 12; y < height; y += 18) ctx.fillRect(6, y, width - 12, 5);
            }
            texture.refresh();
            FALLBACK_TEXTURE_KEYS.add(key);
        }

        function ensureBootFallbackTextures(scene) {
            createFallbackTexture(scene, 'bg_start', 1280, 720, 'background');
            createFallbackTexture(scene, 'bg_menu', 1280, 720, 'background');
        }

        function ensureGameplayFallbackTextures(scene) {
            ['idle_front', 'idle_right', 'run_01', 'run_02', 'run_03', 'run_04', 'slide', 'hit', 'jump', 'doublejump', 'win']
                .forEach(key => createFallbackTexture(scene, key, 64, 96, 'player'));

            const enemyColors = { bacteria_blue: '#2196F3', bacteria_green: '#4CAF50', bacteria_orange: '#FF9800', bacteria_red: '#F44336' };
            Object.entries(enemyColors).forEach(([key, color]) => {
                createFallbackTexture(scene, key + '_01', 64, 64, 'enemy', color);
                createFallbackTexture(scene, key + '_02', 64, 64, 'enemy', color);
            });
            ['boss_idle_01', 'boss_idle_02', 'boss_idle_03', 'boss_attack', 'boss_defeat']
                .forEach(key => createFallbackTexture(scene, key, 160, 160, 'enemy', '#9C27B0'));
            ['mysterybox_01', 'mysterybox_02'].forEach(key => createFallbackTexture(scene, key, 80, 80, 'mystery'));
            ['aura_shield_01', 'aura_shield_02'].forEach(key => createFallbackTexture(scene, key, 160, 180, 'aura', '#00E5FF'));
            ['aura_doublepoin_01', 'aura_doublepoin_02'].forEach(key => createFallbackTexture(scene, key, 160, 180, 'aura', '#FFEB3B'));
            ['aura_extralife_01', 'aura_extralife_02'].forEach(key => createFallbackTexture(scene, key, 160, 180, 'aura', '#E91E63'));
        }

        function ensureAnimations(scene) {
            const add = config => { if (!scene.anims.exists(config.key)) scene.anims.create(config); };
            add({ key: 'run', frames: [ { key: 'run_01' }, { key: 'run_02' }, { key: 'run_03' }, { key: 'run_04' } ], frameRate: 10, repeat: -1 });
            ['bacteria_blue', 'bacteria_green', 'bacteria_orange', 'bacteria_red'].forEach(color => {
                add({ key: 'anim_' + color, frames: [ { key: color + '_01' }, { key: color + '_02' } ], frameRate: 5, repeat: -1 });
            });
            add({ key: 'anim_boss_idle', frames: [ { key: 'boss_idle_01' }, { key: 'boss_idle_02' }, { key: 'boss_idle_03' } ], frameRate: 3, repeat: -1 });
            add({ key: 'anim_mysterybox', frames: [ { key: 'mysterybox_01' }, { key: 'mysterybox_02' } ], frameRate: 4, repeat: -1 });
            add({ key: 'anim_aura_shield', frames: [ { key: 'aura_shield_01' }, { key: 'aura_shield_02' } ], frameRate: 6, repeat: -1 });
            add({ key: 'anim_aura_doublepoin', frames: [ { key: 'aura_doublepoin_01' }, { key: 'aura_doublepoin_02' } ], frameRate: 6, repeat: -1 });
            add({ key: 'anim_aura_extralife', frames: [ { key: 'aura_extralife_01' }, { key: 'aura_extralife_02' } ], frameRate: 6, repeat: -1 });
        }

        function ensureLevelFallbackTextures(scene, level) {
            createFallbackTexture(scene, 'bg_level' + level, 1280, 720, 'background');
            const sizes = {
                lowBox: [80, 80, '#8B4513'], stackedCrate: [80, 160, '#A0522D'],
                overheadBar: [300, 120, '#696969'], tallWall: [80, 260, '#4A148C'],
                lowTunnel: [320, 80, '#455A64']
            };
            Object.entries(sizes).forEach(([key, value]) => {
                createFallbackTexture(scene, key + '_level' + level, value[0], value[1], 'obstacle', value[2]);
            });
        }

        // ==========================================
        // 1. DATA DRIVEN CONFIGURATION
        // ==========================================
        const foodData = {
            apple: { emoji: '🍎', category: 'fruit', score: 50 }, banana: { emoji: '🍌', category: 'fruit', score: 50 },
            broccoli: { emoji: '🥦', category: 'veggies', score: 50 }, egg: { emoji: '🥚', category: 'protein', score: 70 },
            rice: { emoji: '🍚', category: 'carbs', score: 50 }, water: { emoji: '💧', category: 'water', score: 50 },
            soda: { emoji: '🥤', category: 'sugaryDrink', sugar: 30 }, burger: { emoji: '🍔', category: 'junkFood', junk: 30 },
            bacteria_blue: { emoji: '🔵', category: 'enemy', damage: 1 }, bacteria_green: { emoji: '🟢', category: 'enemy', damage: 1 },   
            bacteria_orange: { emoji: '🟠', category: 'enemy', damage: 1 }, bacteria_red: { emoji: '🔴', category: 'enemy', damage: 1 },
            orange: { emoji: '🍊', category: 'fruit', score: 50 }, grape: { emoji: '🍇', category: 'fruit', score: 50 },
            watermelon: { emoji: '🍉', category: 'fruit', score: 50 }, strawberry: { emoji: '🍓', category: 'fruit', score: 50 },
            mango: { emoji: '🥭', category: 'fruit', score: 50 }, pineapple: { emoji: '🍍', category: 'fruit', score: 50 },
            pear: { emoji: '🍐', category: 'fruit', score: 50 }, kiwi: { emoji: '🥝', category: 'fruit', score: 50 },
            peach: { emoji: '🍑', category: 'fruit', score: 50 }, melon: { emoji: '🍈', category: 'fruit', score: 50 },
            carrot: { emoji: '🥕', category: 'veggies', score: 50 }, corn: { emoji: '🌽', category: 'veggies', score: 50 },
            tomato: { emoji: '🍅', category: 'veggies', score: 50 }, eggplant: { emoji: '🍆', category: 'veggies', score: 50 },
            pepper: { emoji: '🫑', category: 'veggies', score: 50 }, cucumber: { emoji: '🥒', category: 'veggies', score: 50 },
            lettuce: { emoji: '🥬', category: 'veggies', score: 50 }, mushroom: { emoji: '🍄', category: 'veggies', score: 50 },

            nuts: { emoji: '🥜', category: 'protein', score: 70 }, shrimp: { emoji: '🦐', category: 'protein', score: 70 },
            cheese: { emoji: '🧀', category: 'protein', score: 70 }, bread: { emoji: '🍞', category: 'carbs', score: 50 },
            potato: { emoji: '🥔', category: 'carbs', score: 50 }, pasta: { emoji: '🍝', category: 'carbs', score: 50 },
            tea: { emoji: '🍵', category: 'water', score: 50 }, coconut: { emoji: '🥥', category: 'water', score: 50 },
            icecream: { emoji: '🍦', category: 'sugaryDrink', sugar: 30 }, donut: { emoji: '🍩', category: 'sugaryDrink', sugar: 30 },
            candy: { emoji: '🍬', category: 'sugaryDrink', sugar: 25 }, chocolate: { emoji: '🍫', category: 'sugaryDrink', sugar: 25 },
            cake: { emoji: '🍰', category: 'sugaryDrink', sugar: 30 }, juicebox: { emoji: '🧃', category: 'sugaryDrink', sugar: 20 },
            pizza: { emoji: '🍕', category: 'junkFood', junk: 30 }, fries: { emoji: '🍟', category: 'junkFood', junk: 25 },
            hotdog: { emoji: '🌭', category: 'junkFood', junk: 25 }, instantnoodle: { emoji: '🍜', category: 'junkFood', junk: 25 },
            taco: { emoji: '🌮', category: 'junkFood', junk: 20 }
        };

        const obstacleData = {
            lowBox: { width: 70, height: 70, yOffset: 0, passMethod: 'jump', color: 0x8B4513 },
            stackedCrate: { width: 70, height: 140, yOffset: 0, passMethod: 'doubleJump', color: 0xA0522D },
            overheadBar: { width: 150, height: 60, yOffset: 48, passMethod: 'slide', color: 0x696969 },
            tallWall: { width: 70, height: 190, yOffset: 0, passMethod: 'doubleJump', color: 0x4A148C },
            lowTunnel: { width: 260, height: 60, yOffset: 48, passMethod: 'slide', color: 0x455A64 }
        };

        // Batas piksel nontransparan hasil audit aset tallWall_level1..8.
        // Koordinat right/bottom bersifat eksklusif, sesuai format bbox gambar.
        const tallWallVisualBounds = Object.freeze({
            1: { left: 0, top: 36, right: 80, bottom: 224, sourceW: 80, sourceH: 260 },
            2: { left: 1, top: 37, right: 69, bottom: 223, sourceW: 80, sourceH: 260 },
            3: { left: 2, top: 36, right: 77, bottom: 219, sourceW: 80, sourceH: 260 },
            4: { left: 0, top: 38, right: 79, bottom: 220, sourceW: 80, sourceH: 260 },
            5: { left: 0, top: 50, right: 78, bottom: 209, sourceW: 80, sourceH: 260 },

        function unlockEarnedAchievements() {
            if (!saveData) return [];
            if (!Array.isArray(saveData.achievements)) saveData.achievements = [];

            const newlyUnlocked = achievementsData.filter(ach =>
                !saveData.achievements.includes(ach.id) && ach.condition(saveData.stats, saveData)
            );
            newlyUnlocked.forEach(ach => saveData.achievements.push(ach.id));
            if (newlyUnlocked.length > 0) SaveManager.saveGame(saveData);
            return newlyUnlocked;
        }

            if (!scene || !scene.add || !scene.tweens) return;

            if (!scene.achievementToastCleanupBound) {
                scene.achievementToastCleanupBound = true;

                    scene.achievementToastQueue = [];

            async generateSFX() {
                const sr = 44100;
                const addBuffer = (key, dur, render) => {
                    return new Promise((resolve) => {
                        try {
                            const length = Math.floor(sr * dur); const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, length, sr);
                            render(ctx); const p = ctx.startRendering();
                            if (p && p.then) { p.then(buffer => { this.cache.audio.add(key, buffer); resolve(); }).catch(err => { resolve(); }); } 
                            else { ctx.oncomplete = (e) => { this.cache.audio.add(key, e.renderedBuffer); resolve(); }; }
                        } catch(err) { resolve(); }
                    });
                };

                const tone = (ctx, type, f0, f1, dur, vol, start = 0) => {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(f0, start);
                    if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), start + dur);
                    gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(vol, start + dur * 0.1); gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(start); osc.stop(start + dur);
                };

                const noise = (ctx, dur, vol, filterFreq, start = 0) => {
                    const bufferSize = Math.floor(sr * dur); const buffer = ctx.createBuffer(1, bufferSize, sr); const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const src = ctx.createBufferSource(); src.buffer = buffer;
                    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = filterFreq;
                    const gain = ctx.createGain(); gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(vol, start + dur * 0.1); gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
                    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination); src.start(start);
                };

                await addBuffer('sfx_click', 0.1, ctx => tone(ctx, 'sine', 600, 300, 0.05, 0.5)); await addBuffer('sfx_jump', 0.3, ctx => tone(ctx, 'sine', 300, 900, 0.2, 0.3));
                await addBuffer('sfx_hit', 0.3, ctx => noise(ctx, 0.2, 0.8, 800));
                await addBuffer('sfx_buff', 0.5, ctx => { tone(ctx, 'square', 523.25, 523.25, 0.1, 0.1, 0); tone(ctx, 'square', 659.25, 659.25, 0.1, 0.1, 0.1); tone(ctx, 'square', 783.99, 783.99, 0.2, 0.1, 0.2); });
                await addBuffer('sfx_correct', 0.4, ctx => { tone(ctx, 'triangle', 523.25, 523.25, 0.1, 0.2, 0); tone(ctx, 'triangle', 783.99, 783.99, 0.2, 0.2, 0.15); });

                this.load.once('complete', () => {

                }).setOrigin(0.5);

                    if (this.levelLoadingText) this.levelLoadingText.setText('MENYIAPKAN LEVEL ' + level + '... ' + Math.round(value * 100) + '%');
                };
                this.load.on('progress', this.levelLoadProgressHandler);

            create() {
                try {
                    const level = this.level || clampCurrentLevel('IntroScene.create');
                    ensureGameplayFallbackTextures(this);
                    ensureLevelFallbackTextures(this, level);
                    ensureAnimations(this);
                    if (this.levelLoadingText) this.levelLoadingText.destroy();
                    gameState.savedCheckpoint = null; this.add.rectangle(0, 0, 1280, 720, 0x000000).setOrigin(0,0);
                    this.add.text(640, 200, `MEMASUKI LEVEL ${level}`, { fontSize: '48px', fontStyle: 'bold', color: '#FFEB3B' }).setOrigin(0.5);
                    let storyText = storyData[level - 1] || "Bersiaplah, Jagoan!";
                    const story = this.add.text(640, 350, storyText, {
                        fontFamily: BODY_FONT, fontSize: '25px', color: '#FFF', align: 'center',
                        wordWrap: { width: 960 }, lineSpacing: 8
                    }).setOrigin(0.5);
                    fitText(story, 960, 220, 18);
                    const tapText = this.add.text(640, 600, 'TAP UNTUK MEMULAI', {
                        fontSize: '24px', fontStyle: 'bold', color: '#4CAF50'
                    }).setOrigin(0.5);

                    // Paksa input aktif kembali saat IntroScene dipakai ulang setelah layar hasil.
                    this.input.enabled = true;
                    this.introStarting = false;

                    // Rectangle transparan lebih konsisten menerima input daripada Zone pada
                    // browser/touch runtime tertentu.
                    const startHitArea = this.add.rectangle(640, 360, 1280, 720, 0x000000, 0.001)
                        .setDepth(1000)
                        .setInteractive({ useHandCursor: true });
                    const inputReadyAt = performance.now() + 120;
                    const canvas = this.game.canvas;

                    const cleanupIntroInput = () => {
                        startHitArea.off('pointerdown', startLevel);
                        this.input.off('pointerdown', startLevel);
                        if (this.input.keyboard) {
                            this.input.keyboard.off('keydown-SPACE', startLevel);
                            this.input.keyboard.off('keydown-ENTER', startLevel);
                        }
                        if (canvas) canvas.removeEventListener('pointerdown', startLevel);
                        document.removeEventListener('pointerdown', startLevel, true);
                        document.removeEventListener('touchstart', startLevel, true);
                        document.removeEventListener('mousedown', startLevel, true);
                        if (this.introAutoStartTimer) {
                            window.clearTimeout(this.introAutoStartTimer);
                            this.introAutoStartTimer = null;
                        }
                    };

                    const startLevel = () => {
                        // Event pembuka dari tombol NEXT LEVEL dapat sampai pada frame yang
                        // sama. Abaikan event itu tanpa menghapus listener untuk tap berikutnya.
                        if (performance.now() < inputReadyAt || this.introStarting) return;
                        this.introStarting = true;
                        cleanupIntroInput();
                        this.input.enabled = false;
                        startHitArea.disableInteractive();
                        tapText.setText('MEMULAI LEVEL...').setColor('#FFEB3B');

                        try {
                            if (saveData.soundOn) this.sound.play('sfx_click');
                        } catch (e) {}

                        try {
                            console.log('Tap intro diterima, memulai level:', level);
                            // GameScene menyalakan UIScene sendiri setelah create() berhasil.
                            this.scene.start('GameScene');
                        } catch (error) {
                            this.introStarting = false;
                            this.input.enabled = true;
                            showSceneLoadError(this, error);
                        }
                    };

                    // Tiga jalur input dengan guard yang sama: objek layar penuh, scene,
                    // dan canvas native sebagai fallback untuk browser mobile tertentu.
                    startHitArea.on('pointerdown', startLevel);
                    this.input.on('pointerdown', startLevel);
                    if (this.input.keyboard) {
                        this.input.keyboard.on('keydown-SPACE', startLevel);
                        this.input.keyboard.on('keydown-ENTER', startLevel);
                    }
                    if (canvas) canvas.addEventListener('pointerdown', startLevel, { passive: true });
                    document.addEventListener('pointerdown', startLevel, true);
                    document.addEventListener('touchstart', startLevel, { capture: true, passive: true });
                    document.addEventListener('mousedown', startLevel, true);

                    // Fallback deterministik: perangkat yang tidak meneruskan event sentuh
                    // tetap masuk ke permainan dan tidak terkunci di IntroScene.
                    this.introAutoStartTimer = window.setTimeout(startLevel, 1800);

                    this.events.once(Phaser.Scenes.Events.SHUTDOWN, cleanupIntroInput);
                } catch (error) {
                    showSceneLoadError(this, error);
                }
            }
        }

        class GameScene extends Phaser.Scene {
            constructor() { 
                super({ key: 'GameScene' }); 
                this.mobileInput = { jump: false, slide: false, left: false, right: false };
            }

            setupMobileControls() {
                this.mobileInput = { jump: false, slide: false, left: false, right: false };
                this.input.on('pointerdown', (pointer) => {
                    this.touchStart = { x: pointer.x, y: pointer.y, time: Date.now() };
                });

                this.input.on('pointerup', (pointer) => {
                    const start = this.touchStart;
                    if (!start) return;

                    const dx = pointer.x - start.x;
                    const dy = pointer.y - start.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const duration = Date.now() - start.time;

                    // Tap = jump
                    if (distance < 35 && duration < 400) {
                        this.mobileInput.jump = true;
                        return;
                    }

                    // Swipe controls
                    if (Math.abs(dy) > Math.abs(dx)) {
                        if (dy < -50) this.mobileInput.jump = true;   // swipe up
                        if (dy > 50) this.mobileInput.slide = true;   // swipe down
                    } else {
                        if (dx < -50) this.mobileInput.left = true;   // swipe left
                        if (dx > 50) this.mobileInput.right = true;   // swipe right
                    }
                });
            }

            create() {
                try {
                const level = clampCurrentLevel('GameScene.create');
                this.sceneCleanupComplete = false;
                this.levelLoopTimers = [];
                this.events.off(Phaser.Scenes.Events.SHUTDOWN, this.cleanupSceneResources, this);
                this.events.off(Phaser.Scenes.Events.DESTROY, this.cleanupSceneResources, this);
                this.events.once(Phaser.Scenes.Events.SHUTDOWN, this.cleanupSceneResources, this);
                this.events.once(Phaser.Scenes.Events.DESTROY, this.cleanupSceneResources, this);

                this.physics.resume(); this.scene.get('AudioScene').playMusic('bgm_level' + level);
                let pendingBuff = gameState.nextLevelBuff;

                if (gameState.savedCheckpoint && gameState.savedCheckpoint.level === currentLevel) {
                    let cp = gameState.savedCheckpoint; let snap = JSON.parse(cp.stateStr); Object.assign(gameState, snap);
                    gameState.savedCheckpoint = cp; gameState.currentComboCategories = new Set(snap.currentComboCategories);
                    if(gameState.health <= 0) gameState.health = 3;
                    gameState.sugarCrashActive = false; gameState.heavyModeActive = false;
                    gameState.invincibleTimer = 3; gameState.extraLifeAuraTimer = 0;
                    this.playerStartX = Math.max(200, cp.x - 150);
                } else {
                    gameState.health = 3; gameState.score = 0; gameState.sugar = 0; gameState.junk = 0;
                    gameState.energy = 100; gameState.hydration = 100; gameState.waterCombo = 0; gameState.hydrationBoostActive = false;
                    gameState.nutrition = { carbs: 0, protein: 0, veggies: 0, fruit: 0, water: 0 };
                    gameState.combo = 0; gameState.currentComboCategories = new Set();
                    gameState.invincibleTimer = 0; gameState.doublePointTimer = 0; gameState.extraLifeAuraTimer = 0;
                    gameState.scoreBreakdown = { food: 0, combo: 0 }; gameState.balancedMealsCount = 0;
                    gameState.startTime = this.time.now; gameState.sugarCrashActive = false;
                    gameState.heavyModeActive = false; gameState.experiencedCrash = false; gameState.savedCheckpoint = null;
                    this.playerStartX = 200;
                    
                    gameState.availableQuizzes = Phaser.Utils.Array.NumberArray(0, quizData.length - 1); Phaser.Utils.Array.Shuffle(gameState.availableQuizzes);

                    if (pendingBuff) {
                        if (pendingBuff.type === 'invincible_10_life') { gameState.invincibleTimer = 10; gameState.health = Math.min(5, gameState.health + 1); gameState.extraLifeAuraTimer = 5; } 
                        else if (pendingBuff.type === 'double_20') { gameState.doublePointTimer = 20; } 
                        else if (pendingBuff.type === 'invincible_5') { gameState.invincibleTimer = 5; }
                        gameState.nextLevelBuff = null; 
                    }
                }

                this.levelTookDamage = false; this.isTutorialActive = false; this.isBossBattle = false;
                this.isBossCutscene = false; this.isGameOver = false; this.bossTimers = []; this.bossItemPillars = [];
                this.levelConfig = levelsData[level - 1];
                if (!this.levelConfig) throw new Error(`Data level ${level} tidak ditemukan.`);

                this.physics.world.setBounds(0, 0, this.levelConfig.length + 1000, 720); this.cameras.main.setBounds(0, 0, this.levelConfig.length, 720);
                this.bg = this.add.tileSprite(0, 0, this.levelConfig.length + 1000, 720, 'bg_level' + currentLevel).setOrigin(0,0);
                this.ground = this.add.rectangle(0, this.levelConfig.groundY, this.levelConfig.length + 1000, 720 - this.levelConfig.groundY, 0x388E3C).setOrigin(0,0);
                this.physics.add.existing(this.ground, true);

                this.foodGroup = this.physics.add.group({ allowGravity: false }); this.enemyGroup = this.physics.add.group({ allowGravity: false });
                this.obstacleGroup = this.physics.add.staticGroup(); this.enemyProjectileGroup = this.physics.add.group({ allowGravity: false });

                this.player = this.physics.add.sprite(this.playerStartX, this.levelConfig.groundY, 'idle_right');
                this.player.setOrigin(0.5, 1); this.player.body.setCollideWorldBounds(true); this.player.body.setGravityY(1500); 
                this.player.body.setSize(40, 80); this.player.body.setOffset(this.player.width/2 - 20, this.player.height - 80);
                this.player.jumps = 0; this.player.isSliding = false; this.player.isHit = false;
                
                this.cameras.main.startFollow(this.player, true, 1, 0); this.cameras.main.followOffset.set(-300, 80); 

                this.auraShield = this.add.sprite(this.player.x, this.player.y - 60, 'aura_shield_01').setDisplaySize(150, 180).setVisible(false); this.auraShield.play('anim_aura_shield');
                this.auraDouble = this.add.sprite(this.player.x, this.player.y - 60, 'aura_doublepoin_01').setDisplaySize(150, 180).setVisible(false); this.auraDouble.play('anim_aura_doublepoin');
                this.auraLife = this.add.sprite(this.player.x, this.player.y - 60, 'aura_extralife_01').setDisplaySize(150, 180).setVisible(false); this.auraLife.play('anim_aura_extralife');

                this.generateLevel();

                this.physics.add.collider(this.player, this.ground); this.physics.add.collider(this.foodGroup, this.ground); 
                this.physics.add.collider(this.player, this.obstacleGroup, this.hitObstacle, null, this);
                this.physics.add.overlap(this.player, this.foodGroup, this.collectFood, null, this);
                this.physics.add.overlap(this.player, this.enemyGroup, this.hitEnemy, null, this);
                this.physics.add.overlap(this.player, this.enemyProjectileGroup, this.hitProjectile, null, this);

                this.cursors = this.input.keyboard.createCursorKeys(); 
                this.spaceBar = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
                this.setupMobileControls();

                this.decayTimer = this.time.addEvent({
                    delay: 1000,
                    callback: () => {
                        if (gameState.health > 0 && !this.isTutorialActive && !this.isBossCutscene) {
                            let oldEnergy = gameState.energy; let oldHydration = gameState.hydration;
                            gameState.energy = Math.max(0, gameState.energy - 1); gameState.hydration = Math.max(0, gameState.hydration - 0.5);
                            if (!gameState.sugarCrashActive && gameState.sugar > 0) gameState.sugar -= 1;
                            if (!gameState.heavyModeActive && gameState.junk > 0) gameState.junk -= 1;
                            if (gameState.invincibleTimer > 0) gameState.invincibleTimer--;
                            if (gameState.doublePointTimer > 0) gameState.doublePointTimer--;
                            if (gameState.extraLifeAuraTimer > 0) gameState.extraLifeAuraTimer--;

                            if (oldEnergy > 0 && gameState.energy === 0) this.showFloatingText(this.player.x, this.player.y - 80, 'LOW ENERGY!', '#FFEB3B');
                            if (oldHydration > 0 && gameState.hydration === 0) this.showFloatingText(this.player.x, this.player.y - 80, 'DEHYDRATED!', '#03A9F4');
                            this.events.emit('updateUI');
                        }
                    }, loop: true
                });
                this.levelLoopTimers.push(this.decayTimer);

                // UI baru dinyalakan setelah seluruh object GameScene selesai dibuat.
                // Ini mencegah IntroScene mencoba launch UI setelah dirinya dihentikan.
                if (!this.scene.isActive('UIScene')) this.scene.launch('UIScene');
                console.log('GameScene siap dimainkan, level:', level);

                if (currentLevel === 1 && !gameState.savedCheckpoint) this.showTutorialLevel1();
                } catch (error) {
                    this.cleanupSceneResources();
                    showSceneLoadError(this, error);
                }
            }

            cleanupSceneResources() {
                if (this.sceneCleanupComplete) return;
                this.sceneCleanupComplete = true;

                const timers = [
                    ...(this.levelLoopTimers || []),
                    ...(this.bossTimers || [])
                ];
                new Set(timers).forEach(timer => {
                    if (timer) timer.destroy();
                });
                this.levelLoopTimers = [];
                this.bossTimers = [];
                this.decayTimer = null;

                if (this.time) this.time.removeAllEvents();
                if (this.tweens) this.tweens.killAll();
                if (this.game && this.game.events) this.game.events.off('tutorialPopupConfirmed');
            }

            generateLevel() {
                const level = clampCurrentLevel('GameScene.generateLevel');
                this.levelConfig.items.forEach(item => {
                    if (item.x < this.playerStartX) return;
                    if (item.type === 'food') {
                        const data = foodData[item.id];
                        let obj = this.add.text(item.x, item.y, data.emoji, { fontSize: '40px', padding: { left: 15, right: 15, top: 15, bottom: 15 } }).setOrigin(0.5);
                        this.physics.add.existing(obj); obj.body.setSize(40, 40); obj.itemData = data; obj.itemId = item.id; this.foodGroup.add(obj);
                    } else if (item.type === 'enemy') {
                        const data = foodData[item.id]; let obj = this.add.sprite(item.x, item.y, item.id + '_01');
                        const enemyDisplaySizes = { bacteria_blue: 80, bacteria_green: 80, bacteria_orange: 80, bacteria_red: 80 };
                        if (enemyDisplaySizes[item.id]) obj.setDisplaySize(enemyDisplaySizes[item.id], enemyDisplaySizes[item.id]);
                        this.physics.add.existing(obj); obj.body.setSize(40, 40); obj.play('anim_' + item.id); obj.itemData = data; obj.itemId = item.id; this.enemyGroup.add(obj);
                        
                        if (item.id === 'bacteria_green') { obj.body.setVelocityX(-150); } 
                        else if (item.id === 'bacteria_orange') { this.tweens.add({ targets: obj, y: item.y - 120, duration: 1000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' }); } 
                        else if (item.id === 'bacteria_red') {
                            const enemyFireTimer = this.time.addEvent({ delay: 1500, callback: () => {
                                    if (obj && obj.active && this.player && obj.x - this.player.x < 1000 && obj.x > this.player.x && !this.isTutorialActive) {
                                        let proj = this.add.circle(obj.x - 20, obj.y, 10, 0xFF0000); this.physics.add.existing(proj); this.enemyProjectileGroup.add(proj);
                                        proj.body.setAllowGravity(false); proj.body.setCircle(10); proj.body.setVelocityX(-400);
                                        this.time.delayedCall(4000, () => { if (proj && proj.active) proj.destroy(); });
                                    }
                                }, loop: true
                            });
                            this.levelLoopTimers.push(enemyFireTimer);
                        }
                    } else if (item.type === 'quizBox') {
                        let obj = this.add.sprite(item.x, item.y, 'mysterybox_01'); obj.setDisplaySize(80, 80); obj.play('anim_mysterybox');
                        this.physics.add.existing(obj); obj.body.setSize(40, 40); obj.isQuizBox = true; this.foodGroup.add(obj); 
                    } else if (item.type === 'obstacle') {
                        const oData = obstacleData[item.id];
                        const obstacleDisplaySizes = { lowBox: { w: 80, h: 80 }, stackedCrate: { w: 80, h: 160 }, overheadBar: { w: 300, h: 120 }, tallWall: { w: 80, h: 260 }, lowTunnel: { w: 320, h: 80 } };
                        const dSize = obstacleDisplaySizes[item.id];
                        if (!oData || !dSize) {
                            console.warn('Konfigurasi obstacle tidak ditemukan:', item.id);
                            return;
                        }

                        let yPos = this.levelConfig.groundY - oData.yOffset - (dSize.h / 2);
                        if (item.id === 'lowTunnel' && lowTunnelPositionCorrection[level]) {
                            yPos += lowTunnelPositionCorrection[level];
                        }
                        let hitboxWidth = oData.width;
                        let hitboxHeight = oData.height;
                        let hitboxOffsetX = (dSize.w - oData.width) / 2;
                        let hitboxOffsetY = (dSize.h - oData.height) / 2;

                        const boundsByLevel = obstacleVisualBounds[item.id];
                        const visualBounds = boundsByLevel ? boundsByLevel[level] : null;

                        if (visualBounds) {
                            const bounds = visualBounds;
                            const scaleX = dSize.w / bounds.sourceW;
                            const scaleY = dSize.h / bounds.sourceH;
                            const bottomInset = (bounds.sourceH - bounds.bottom) * scaleY;

                            // Posisikan piksel terbawah pada target bawah obstacle. Untuk
                            // lowTunnel targetnya tetap groundY-yOffset agar celah slide terjaga.
                            yPos = this.levelConfig.groundY - oData.yOffset - (dSize.h / 2) + bottomInset;
                            hitboxWidth = (bounds.right - bounds.left) * scaleX;
                            hitboxHeight = (bounds.bottom - bounds.top) * scaleY;
                            hitboxOffsetX = bounds.left * scaleX;
                            hitboxOffsetY = bounds.top * scaleY;
                        }

                        // Koreksi visual lowTunnel saja.
                        // Tidak mengubah sprite player dan tidak mengubah sistem collision.
                        if (item.id === 'lowTunnel' && lowTunnelPositionCorrection[level]) {
                            yPos += lowTunnelPositionCorrection[level];
                        }

                        const obs = this.add.image(item.x, yPos, item.id + '_level' + currentLevel);
                        obs.setDisplaySize(dSize.w, dSize.h);

                        this.physics.add.existing(obs, true);
                        obs.body.setSize(hitboxWidth, hitboxHeight);
                        obs.body.setOffset(hitboxOffsetX, hitboxOffsetY);

                        // Tuning permukaan lowTunnel: turunkan bidang pijak collision
                        // agar posisi kaki player sejajar dengan visual platform.
                        if (item.id === 'lowTunnel' && lowTunnelSurfaceCorrection[level]) {
                            obs.body.position.y += lowTunnelSurfaceCorrection[level];
                        }

                        // Simpan metadata agar collider player dapat melakukan
                        // koreksi posisi kaki saat berada di atas lowTunnel.
                        obs.obstacleType = item.id;
                        obs.levelId = level;
                        if (item.id === 'lowTunnel') {
                            obs.body.checkCollision.up = true;
                            obs.body.checkCollision.down = false;
                            obs.body.checkCollision.left = true;
                            obs.body.checkCollision.right = true;
                        }

                        this.obstacleGroup.add(obs);
                    }
                });
                
                this.finishLine = this.add.rectangle(this.levelConfig.length, this.levelConfig.groundY - 500, 20, 1000, 0xFFEB3B);
                this.physics.add.existing(this.finishLine, true);
                
                this.isFinished = false; 
                this.physics.add.overlap(this.player, this.finishLine, () => {
                    if (this.isFinished) return;
                    if (currentLevel === 8 && !this.isBossBattle) this.startBossBattle();
                    else if (currentLevel !== 8) {
                        this.isFinished = true;
                        if (!this.levelTookDamage) { saveData.stats.perfectRuns++; checkAndUnlockAchievements(this); }
                        this.scene.stop('UIScene');
                        
                        if (currentLevel === 2 || currentLevel === 3 || currentLevel === 5) { this.scene.start('SortNutrisiScene', { level: currentLevel }); } 
                        else if (currentLevel === 7) { this.scene.start('UrutkanPencernaanScene', { level: currentLevel }); } 
                        else { this.scene.start('LevelEvaluationScene', { level: currentLevel }); }
                    }
                });

                let cpX = this.levelConfig.length * 0.5;
                if (this.playerStartX < cpX) {
                    let cpTrigger = this.add.rectangle(cpX, this.levelConfig.groundY - 100, 50, 600, 0x00FF00, 0); 
                    this.physics.add.existing(cpTrigger, true); this.checkpointReached = false;
                    this.physics.add.overlap(this.player, cpTrigger, () => {
                        if (!this.checkpointReached) {
                            this.checkpointReached = true;
                            try { if (saveData.soundOn) this.sound.play('sfx_buff'); } catch(e){}
                            this.showFloatingText(this.player.x, this.player.y - 150, 'CHECKPOINT!', '#00FFFF');
                            let snap = Object.assign({}, gameState); snap.currentComboCategories = Array.from(gameState.currentComboCategories); 
                            gameState.savedCheckpoint = { level: currentLevel, x: this.player.x, stateStr: JSON.stringify(snap) };
                        }
                    });
                }
            }

            update() {
                if (this.isTutorialActive) return;
                if (this.isBossCutscene) { this.player.body.setVelocityX(0); return; }
                if (this.player && this.player.active) {
                    this.auraShield.setPosition(this.player.x, this.player.y - 60).setVisible(gameState.invincibleTimer > 0);
                    this.auraDouble.setPosition(this.player.x, this.player.y - 60).setVisible(gameState.doublePointTimer > 0);
                    this.auraLife.setPosition(this.player.x, this.player.y - 60).setVisible(gameState.extraLifeAuraTimer > 0);
                }

                let distanceRun = this.player.x; let dynamicSpeed = Math.min(550, 300 + Math.floor(distanceRun / 1000) * 18);
                let speed = dynamicSpeed; let jumpVel = Math.min(-700, -700 - (speed - 300) * 0.4); 
                
                if (gameState.energy === 0 || gameState.hydration === 0) speed = 200;
                if (gameState.sugarCrashActive) { speed *= 0.6; jumpVel *= 0.8; }
                if (gameState.heavyModeActive) { speed *= 0.6; jumpVel *= 0.85; }
                if (gameState.hydrationBoostActive) speed *= 1.3;
                if (gameState.health <= 0) { this.player.body.setVelocityX(0); return; }
                
                if (this.isBossBattle) {
                    speed = Math.min(speed, 400);
                    if (this.cursors.left.isDown || this.mobileInput.left) { this.player.body.setVelocityX(-speed); this.player.setFlipX(true); } 
                    else if (this.cursors.right.isDown || this.mobileInput.right) { this.player.body.setVelocityX(speed); this.player.setFlipX(false); } 
                    else { this.player.body.setVelocityX(0); }
                } else {
                    this.player.body.setVelocityX(speed); this.player.setFlipX(false);
                }

                const onGround = this.player.body.touching.down;

                if (onGround) this.player.jumps = 0;
                const justJumped = Phaser.Input.Keyboard.JustDown(this.spaceBar) || 
                    Phaser.Input.Keyboard.JustDown(this.cursors.up) || this.mobileInput.jump; 
                this.mobileInput.jump = false;
                
                if (justJumped && this.player.jumps < 2 && !this.player.isSliding && !this.player.isHit) {
                    this.player.body.setVelocityY(jumpVel); this.player.jumps++;
                    try { if (saveData.soundOn) this.sound.play('sfx_jump'); } catch(e){}
                }

                if (this.player.isHit) {
                    this.player.anims.stop(); this.player.setTexture('hit');
                } else if ((this.cursors.down.isDown || this.mobileInput.slide) && onGround && !this.player.isSliding) {
                    this.player.isSliding = true; this.player.anims.stop(); this.player.setTexture('slide');
                    this.player.body.setSize(40, 40); this.player.body.setOffset(this.player.width/2 - 20, this.player.height - 40); 
                    this.mobileInput.slide = false;
                    this.time.delayedCall(500, () => {
                        this.player.isSliding = false; this.player.anims.play('run', true);
                        this.player.body.setSize(40, 80); this.player.body.setOffset(this.player.width/2 - 20, this.player.height - 80);
                    });
                } else if (!this.player.isSliding) {
                    if (!onGround) { this.player.anims.stop(); if (this.player.jumps > 1) this.player.setTexture('doublejump'); else this.player.setTexture('jump'); } 
                    else { this.player.anims.play('run', true); }
                }

                this.enemyGroup.getChildren().forEach(enemy => {
                    if (!enemy.passed && enemy.x < this.player.x - 30) {
                        enemy.passed = true;
                        if (!this.player.isHit) { saveData.stats.bacteriaDodged++; checkAndUnlockAchievements(this); }
                    }
                });
                
                if(this.player.y > 800) this.gameOver(); 
            }

            collectFood(player, food) {
                if (food.isQuizBox) {
                    try { if (saveData.soundOn) this.sound.play('sfx_click'); } catch(e){}
                    this.tweens.killTweensOf(food); food.destroy();
                    this.scene.pause(); this.scene.get('UIScene').scene.pause(); this.scene.launch('QuizScene', { playerX: player.x, playerY: player.y });
                    return;
                }

                if (food.isBossItem) { let idx = this.bossItemPillars.indexOf(food); if (idx > -1) this.bossItemPillars.splice(idx, 1); }

                if (food.itemId && !saveData.foodpediaUnlocked.includes(food.itemId) && food.itemData.category !== 'enemy') {
                    saveData.foodpediaUnlocked.push(food.itemId); SaveManager.saveGame(saveData);
                    try { if (saveData.soundOn) this.sound.play('sfx_buff'); } catch(e){}
                    this.showFloatingText(food.x, food.y - 60, `🌟 FOODPEDIA BARU!`, '#FFD700');
                }

                this.tweens.killTweensOf(food); food.destroy();
                const data = food.itemData; let sfxKey = 'sfx_eat'; 
                switch(data.category) {
                    case 'fruit': sfxKey = 'sfx_fruit'; break; case 'veggies': sfxKey = 'sfx_veggies'; break; case 'protein': sfxKey = 'sfx_protein'; break;
                    case 'carbs': sfxKey = 'sfx_carbs'; break; case 'water': sfxKey = 'sfx_water'; break; case 'sugaryDrink': sfxKey = 'sfx_sugary'; break; case 'junkFood': sfxKey = 'sfx_junk'; break;
                }
                try { if (saveData.soundOn) this.sound.play(sfxKey); } catch(e) {}

                let scoreGained = data.score || 0;
                if (scoreGained > 0) {
                    let penaltyPercent = 0;
                    if (gameState.sugar >= 100 || gameState.junk >= 100) penaltyPercent = 0.2; 
                    else if (gameState.sugar >= 50 || gameState.junk >= 50) penaltyPercent = 0.1; 
                    scoreGained = Math.floor(scoreGained * (1 - penaltyPercent));
                }

                if (gameState.doublePointTimer > 0 && scoreGained > 0) scoreGained *= 2;
                gameState.score += scoreGained; gameState.scoreBreakdown.food += scoreGained;

                if (food.isBossItem && this.isBossBattle && gameState.bossShieldActive) {
                    if (['fruit', 'veggies', 'protein', 'water', 'carbs'].includes(data.category)) {
                        gameState.bossItemsCollected++;
                        this.showFloatingText(player.x, player.y - 120, `${gameState.bossItemsCollected}/5 SHIELD RETAK!`, '#2196F3');
                        if (gameState.bossItemsCollected >= 5) {
                            gameState.bossShieldActive = false;
                            try { if (saveData.soundOn) this.sound.play('sfx_buff'); } catch(e){}
                            this.bossShield.setVisible(false); this.showFloatingText(this.boss.x, this.boss.y - 120, "SHIELD HANCUR! SERANG!", '#FFEB3B');
                            this.boss.setTexture('boss_idle_01'); 
                        }
                    }
                }

                this.showFloatingText(food.x, food.y - 30, `+${scoreGained}`, '#4CAF50');

                if (data.category === 'sugaryDrink') {
                    gameState.sugar = Math.min(100, gameState.sugar + data.sugar); gameState.combo = 0; gameState.currentComboCategories.clear();
                    if (gameState.sugar >= 100 && !gameState.sugarCrashActive) {
                        gameState.sugarCrashActive = true; gameState.experiencedCrash = true; gameState.energy = Math.max(0, gameState.energy - 15);
                        this.showFloatingText(player.x, player.y - 80, 'SUGAR CRASH!', '#FF0000');
                        this.time.delayedCall(6000, () => { gameState.sugarCrashActive = false; gameState.sugar = 50; });
                    } else if (!gameState.sugarCrashActive) { this.showFloatingText(food.x, food.y - 45, '+SUGAR', '#FF0000'); }
                    this.events.emit('updateUI'); return;
                }
                
                if (data.category === 'junkFood') {
                    gameState.junk = Math.min(100, gameState.junk + data.junk); gameState.combo = 0; gameState.currentComboCategories.clear();
                    if (gameState.junk >= 100 && !gameState.heavyModeActive) {
                        gameState.heavyModeActive = true; gameState.experiencedCrash = true;
                        this.showFloatingText(player.x, player.y - 80, 'HEAVY MODE!', '#FF9800');
                        this.time.delayedCall(6000, () => { gameState.heavyModeActive = false; gameState.junk = 50; });
                    } else if (!gameState.heavyModeActive) { this.showFloatingText(food.x, food.y - 45, '+JUNK', '#FF9800'); }
                    this.events.emit('updateUI'); return;
                }

                if (gameState.heavyModeActive) {
                    this.showFloatingText(player.x, player.y - 60, "COMBO TERKUNCI!", '#FF9800');
                } else {
                    gameState.combo += 1;
                    if ([2, 3, 4, 5].includes(gameState.combo)) this.showFloatingText(player.x, player.y - 60, `HEALTHY COMBO ×${gameState.combo}`, '#FFEB3B');
                    if (['fruit', 'veggies', 'protein', 'carbs', 'water'].includes(data.category)) {
                        if (gameState.sugar > 0 && !gameState.sugarCrashActive) gameState.sugar = Math.max(0, gameState.sugar - 10);
                        if (gameState.junk > 0 && !gameState.heavyModeActive) gameState.junk = Math.max(0, gameState.junk - 10);
                        gameState.currentComboCategories.add(data.category);
                        if (gameState.currentComboCategories.size === 5) {
                            gameState.score += 500; gameState.scoreBreakdown.combo += 500;
                            try { if (saveData.soundOn) this.sound.play('sfx_buff'); } catch(e){}
                            this.showFloatingText(player.x, player.y - 90, 'BALANCED COMBO! +500', '#FF9800');
                            gameState.currentComboCategories.clear();
                        }
                    }
                }

                if (data.category === 'carbs' || data.category === 'protein') gameState.energy = Math.min(100, gameState.energy + 10);
                if (data.category === 'water') {
                    gameState.hydration = Math.min(100, gameState.hydration + 15); gameState.waterCombo += 1;
                    if (gameState.waterCombo >= 3) {
                        gameState.waterCombo = 0; gameState.score += 100; gameState.scoreBreakdown.combo += 100; gameState.hydrationBoostActive = true;
                        try { if (saveData.soundOn) this.sound.play('sfx_buff'); } catch(e){}
                        this.showFloatingText(player.x, player.y - 120, 'HYDRATION BOOST!', '#03A9F4');
                        this.time.delayedCall(5000, () => { gameState.hydrationBoostActive = false; this.events.emit('updateUI'); });
                    }
                }

                if (data.category === 'fruit') { gameState.nutrition.fruit++; saveData.stats.fruits++; }
                if (data.category === 'veggies') { gameState.nutrition.veggies++; saveData.stats.veggies++; }
                if (data.category === 'protein') { gameState.nutrition.protein++; }
                if (data.category === 'carbs') { gameState.nutrition.carbs++; }
                if (data.category === 'water') { gameState.nutrition.water++; saveData.stats.water++; }

                let n = gameState.nutrition, t = this.levelConfig.nutritionTarget;
                if (n.fruit >= t.fruit && n.veggies >= t.veggies && n.protein >= t.protein && n.carbs >= t.carbs && n.water >= t.water) {
                    gameState.score += 1000; gameState.scoreBreakdown.combo += 1000; gameState.balancedMealsCount += 1; saveData.stats.balancedMeals++; 
                    try { if (saveData.soundOn) this.sound.play('sfx_win'); } catch(e){}
                    this.showFloatingText(player.x, player.y - 120, 'BALANCED MEAL! +1000', '#FFD700');
                    gameState.nutrition = { carbs: 0, protein: 0, veggies: 0, fruit: 0, water: 0 }; 
                }
                checkAndUnlockAchievements(this); this.events.emit('updateUI');
            }

            hitEnemy(player, enemy) { 
                if (player.body.velocity.y > 0 && player.y < enemy.y) {
                    player.body.setVelocityY(-500); this.tweens.killTweensOf(enemy); enemy.destroy();
                    try { if (saveData.soundOn) this.sound.play('sfx_jump'); } catch(e){}
                    gameState.score += 50; this.showFloatingText(enemy.x, enemy.y, 'STOMPED!', '#FFEB3B'); this.events.emit('updateUI');
                } else {
                    this.tweens.killTweensOf(enemy); enemy.destroy(); this.takeDamage(enemy.itemData.damage, 'OUCH! BACTERIA!'); 
                }
            }
            
            hitProjectile(player, projectile) { this.tweens.killTweensOf(projectile); projectile.destroy(); this.takeDamage(1, 'TERTEMBAK BAKTERI!'); }
            hitObstacle(player, obstacle) { if (player.body.touching.right && obstacle.body.touching.left) { obstacle.destroy(); this.takeDamage(1, 'BUMP!'); } }

            takeDamage(amount, msg) {
                if (gameState.invincibleTimer > 0) { this.showFloatingText(this.player.x, this.player.y - 80, 'KEBAL!', '#FFEB3B'); return; }
                if(this.player.isHit) return; 
                try { if (saveData.soundOn) this.sound.play('sfx_hit'); } catch(e){}

                this.levelTookDamage = true; gameState.health -= amount; gameState.combo = 0; gameState.waterCombo = 0; gameState.currentComboCategories.clear();
                this.cameras.main.shake(200, 0.01); this.showFloatingText(this.player.x, this.player.y - 80, msg, '#F44336'); this.events.emit('updateUI');
                
                this.player.isHit = true; this.time.delayedCall(500, () => { this.player.isHit = false; });
                if (gameState.health <= 0) this.gameOver();
            }

            startBossBattle() {
                try {
                    this.isBossBattle = true; this.isBossCutscene = true; this.physics.pause();
                    if (this.finishLine) this.finishLine.destroy(); 
                    this.player.body.setVelocityX(0); this.player.anims.stop(); this.player.setTexture('idle_right');
                    
                    let arenaStartX = this.levelConfig.length;
                    this.cameras.main.setBounds(0, 0, arenaStartX + 1280, 720); this.physics.world.setBounds(arenaStartX - 100, 0, 1000, 720); 
                    this.cameras.main.stopFollow(); this.cameras.main.pan(arenaStartX + 400, 360, 2000, 'Sine.easeInOut');
                    if (this.bg) this.bg.setSize(this.bg.width + 1280, 720); 

                    this.boss = this.add.sprite(arenaStartX + 700, this.levelConfig.groundY - 120, 'boss_attack');
                    this.physics.add.existing(this.boss); this.boss.body.setSize(90, 110); this.boss.body.setImmovable(true); this.boss.body.setAllowGravity(false);
                    this.bossShield = this.add.circle(this.boss.x, this.boss.y, 90, 0xFF00FF, 0.4);
                    this.tweens.add({ targets: [this.boss, this.bossShield], y: '-=60', duration: 1500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

                    gameState.bossPhase = 3; gameState.bossShieldActive = true; gameState.bossItemsCollected = 0;

                    this.cameras.main.once(Phaser.Cameras.Scene2D.Events.PAN_COMPLETE, () => {
                        if (!this.isGameOver) this.showBossTutorial(arenaStartX);

            }

            dropHealthyFood(arenaStartX) {
                let healthy = ['apple', 'water', 'broccoli', 'egg', 'rice', 'orange', 'carrot', 'meat', 'milk', 'potato', 'watermelon', 'fish'];
                let id = healthy[Phaser.Math.Between(0, healthy.length - 1)];
                let x = arenaStartX + Phaser.Math.Between(150, 750); let y = this.levelConfig.groundY - 600; 
                let data = foodData[id];
                let obj = this.add.text(x, y, data.emoji, { fontSize: '40px', padding: { left: 15, right: 15, top: 15, bottom: 15 } }).setOrigin(0.5);
                this.physics.add.existing(obj); obj.itemData = data; obj.isBossItem = true; this.foodGroup.add(obj); this.bossItemPillars.push(obj);
                obj.body.setSize(40, 40); obj.body.setAllowGravity(true); obj.body.setGravityY(800); obj.body.setBounce(0.3); obj.body.setCollideWorldBounds(true);
                this.time.delayedCall(10000, () => { if (obj && obj.active) { obj.destroy(); } });
            }

            bossThrowJunk() {
                let unhealthy = ['soda', 'burger', 'pizza', 'icecream', 'candy', 'fries', 'donut', 'chocolate', 'cake'];
                let id = unhealthy[Phaser.Math.Between(0, unhealthy.length - 1)];
                let x = this.boss.x - 60; let y = this.boss.y - 40;
                let data = foodData[id];
                let obj = this.add.text(x, y, data.emoji, { fontSize: '40px', padding: { left: 15, right: 15, top: 15, bottom: 15 } }).setOrigin(0.5);
                this.physics.add.existing(obj); obj.itemData = data; this.foodGroup.add(obj); this.bossItemPillars.push(obj);
                obj.body.setSize(40, 40); obj.body.setAllowGravity(true); obj.body.setGravityY(800); obj.body.setBounce(0.5); obj.body.setCollideWorldBounds(true);
                obj.body.setVelocity(Phaser.Math.Between(-300, -600), Phaser.Math.Between(-300, -500));
                this.time.delayedCall(10000, () => { if (obj && obj.active) { obj.destroy(); } });
            }

            bossSummonBacteria() {
                let x = this.boss.x - 50; let y = this.levelConfig.groundY - 40;
                let data = foodData['bacteria_green']; let obj = this.add.sprite(x, y, 'bacteria_green_01'); obj.setDisplaySize(80, 80);
                this.physics.add.existing(obj); obj.play('anim_bacteria_green'); obj.itemData = data; obj.itemId = 'bacteria_green'; this.enemyGroup.add(obj);
                obj.body.setSize(40, 40); obj.body.setAllowGravity(false); obj.body.setVelocityX(Phaser.Math.Between(-150, -300)); 
                this.time.delayedCall(12000, () => { if (obj && obj.active) { obj.destroy(); } });
            }

            hitBoss(player, boss) {
                if (gameState.bossShieldActive) {
                    if (!player.isHit) { this.takeDamage(1, 'TERKENA SHIELD!'); player.body.setVelocityX(player.x < boss.x ? -400 : 400); }
                } else {
                    if (player.body.velocity.y > 0 && player.y < boss.y) {
                        gameState.bossPhase--; player.body.setVelocityY(-600); 
                        try { if (saveData.soundOn) this.sound.play('sfx_hit'); } catch(e){}
                        
                        if (gameState.bossPhase <= 0) {
                            boss.setTexture('boss_defeat'); 
                            this.time.delayedCall(800, () => {
                                boss.body.enable = false; boss.setVisible(false); this.bossShield.setVisible(false);
                                if (this.bossTimers) { this.bossTimers.forEach(t => t.destroy()); this.bossTimers = []; }
                                this.bossItemPillars.forEach(i => { if(i && i.active) { this.tweens.killTweensOf(i); i.body.enable = false; i.setVisible(false); } });
                                try { if (saveData.soundOn) this.sound.play('sfx_win'); } catch(e){}
                                this.showFloatingText(player.x, player.y, "SUGAR MONSTER KALAH!", '#4CAF50');
                                
                                this.time.delayedCall(2500, () => {
                                    this.isFinished = true;
                                    if (!this.levelTookDamage) { saveData.stats.perfectRuns++; checkAndUnlockAchievements(this); }
                                    this.scene.stop('UIScene');
                                    this.scene.start('UrutkanPencernaanScene', { level: currentLevel });
                                });
                            });
                        } else {
                            this.showFloatingText(boss.x, boss.y - 120, `FASE ${3 - gameState.bossPhase} SELESAI!`, '#FF9800');
                            gameState.bossShieldActive = true; this.bossShield.setVisible(true); gameState.bossItemsCollected = 0; boss.setTexture('boss_attack');
                            if (this.bossTimers) { this.bossTimers.forEach(t => t.destroy()); this.bossTimers = []; }
                            this.time.delayedCall(1000, () => {
                                this.bossTimers = []; let arenaX = this.levelConfig.length;
                                this.bossTimers.push(this.time.addEvent({ delay: 1500, callback: () => { if (gameState.bossShieldActive) this.dropHealthyFood(arenaX); }, loop: true }));
                                this.bossTimers.push(this.time.addEvent({ delay: 3500, callback: () => { if (this.boss && this.boss.active && gameState.health > 0) this.bossThrowJunk(); }, loop: true }));
                                this.bossTimers.push(this.time.addEvent({ delay: 5000, callback: () => { if (this.boss && this.boss.active && gameState.health > 0) this.bossSummonBacteria(); }, loop: true }));
                            });
                        }
                    } else {
                        if (!player.isHit) { this.takeDamage(1, 'AWAS BOSS!'); player.body.setVelocityX(player.x < boss.x ? -400 : 400); }
                    }
                }
            }

            showTutorialLevel1() {
                try {
                    this.isTutorialActive = true; this.physics.pause(); 
                    this.scene.launch('TutorialPopupScene', {
                        popupId: 'level1', title: 'TUTORIAL LEVEL 1',

                    });

                        if (id === 'level1') { try { this.isTutorialActive = false; this.physics.resume(); } catch(e) {} }
                    });
                } catch (e) {}
            }

            showBossTutorial(arenaStartX) {
                try {
                    this.isTutorialActive = true; this.physics.pause(); 
                    this.scene.launch('TutorialPopupScene', {
                        popupId: 'boss', title: 'BOSS BATTLE: SUGAR MONSTER',
                        bodyText: "• KONTROL MANUAL: Gunakan Panah KIRI / KANAN untuk bergerak.\n• PERISAI BOSS: Kumpulkan 5 Makanan Sehat yang jatuh terus-menerus untuk menghancurkan perisai!\n• HINDARI: Permen & junk food yang dilempar boss (membuat lambat) dan Bakteri Hijau!\n• SERANG: Setelah perisai hancur, LOMPAT ke atas kepala boss!",
                        buttonText: 'LAWAN!', borderColor: 0xFF5252, titleColor: '#FF5252'
                    });
                    this.game.events.off('tutorialPopupConfirmed');
                    this.game.events.once('tutorialPopupConfirmed', (id) => {
                        if (id === 'boss') {
                            try {

                                this.physics.add.overlap(this.player, this.boss, this.hitBoss, null, this);
                                this.bossTimers = [];
                                this.bossTimers.push(this.time.addEvent({ delay: 1500, callback: () => { if (gameState.bossShieldActive) this.dropHealthyFood(arenaStartX); }, loop: true }));

                                this.bossTimers.push(this.time.addEvent({ delay: 6000, callback: () => { if (this.boss && this.boss.active && gameState.health > 0) this.bossSummonBacteria(); }, loop: true }));

                if (this.bossTimers) { this.bossTimers.forEach(t => t.destroy()); this.bossTimers = []; }
